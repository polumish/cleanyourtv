plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvcameras'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvcameras'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // Rive ships a native renderer per ABI; TVs are Arm. x86 is for desktop emulators only.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // RTP over TCP and AAC from go2rtc, which the platform MediaPlayer cannot do.
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.3.1'
    // Rive: the tile's glass frame, focus ring and connecting shimmer (rive/camera-tile, built with the Rive CLI).
    implementation 'app.rive:rive-android:10.2.0'
}
